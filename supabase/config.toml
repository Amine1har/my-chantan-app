# Supabase project configuration
# Auto-generated by Chantan. The project_id is filled when you connect a Supabase backend
# (either Chantan-managed or your own BYO project).

# To run locally:
#   1. Install Supabase CLI: https://supabase.com/docs/guides/cli
#   2. supabase init        (if first time)
#   3. supabase login
#   4. supabase link --project-ref <project_id>
#   5. supabase db push     (apply migrations)
#   6. supabase functions deploy <name>  (deploy edge functions)

project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Per-function configuration. Each edge function in functions/<name>/ can be
# configured here. verify_jwt = false means the function is public (use for
# webhooks like Stripe). verify_jwt = true requires the caller to be signed in.
# Examples (uncomment when you have functions):
# [functions.stripe-webhook]
# verify_jwt = false
#
# [functions.send-email]
# verify_jwt = true
